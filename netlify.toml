[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Netlify detects Next.js and runs it on its OpenNext-based runtime, which
# supports on-demand revalidation (revalidateTag) used by the admin page.

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/maplibre/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Static assets that rarely change. Not content-hashed, so a week with
# stale-while-revalidate rather than immutable: an update shows up on the
# next visit after it's fetched in the background.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/flags/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=2592000"

[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
