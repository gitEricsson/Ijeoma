name: Keep Supabase awake

# Free Supabase projects pause after a week without activity. One tiny read
# each week keeps the admin page working between expeditions.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/site_state?select=status" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" > /dev/null
